name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java (required by Gradle/Android)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      # Instead of committing a hand-written android/ folder (whose AGP /
      # Gradle / Kotlin versions inevitably drift out of sync with whatever
      # Flutter version this workflow happens to install), we let Flutter
      # generate a brand-new, guaranteed-compatible android/ folder here,
      # using whichever Flutter version the step above just installed.
      - name: Generate a fresh android/ project from this Flutter version's own template
        run: |
          flutter create --platforms=android --org com.example --project-name salary_tracker .

      # Now layer our actual customizations on top of that freshly generated,
      # version-correct project: fingerprint permissions, the
      # FlutterFragmentActivity subclass local_auth needs, and the Firebase
      # Gradle plugin.
      - name: Apply Salary Tracker customizations to the generated Android project
        run: |
          set -e

          # 1) Swap in our AndroidManifest.xml (adds biometric + internet permissions)
          cp android_overlay/app/src/main/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

          # 2) Swap in our MainActivity.kt (extends FlutterFragmentActivity, required by local_auth)
          cp android_overlay/app/src/main/kotlin/com/example/salary_tracker/MainActivity.kt \
             android/app/src/main/kotlin/com/example/salary_tracker/MainActivity.kt

          # 3) Register the Google Services (Firebase) Gradle plugin.
          #    Flutter 3.29+ generates Kotlin DSL (.gradle.kts) files by default;
          #    older versions generate Groovy (.gradle). Detect which we got.
          SETTINGS_FILE="android/settings.gradle"
          [ -f "android/settings.gradle.kts" ] && SETTINGS_FILE="android/settings.gradle.kts"

          APP_BUILD_FILE="android/app/build.gradle"
          [ -f "android/app/build.gradle.kts" ] && APP_BUILD_FILE="android/app/build.gradle.kts"

          echo "Detected: $SETTINGS_FILE / $APP_BUILD_FILE"

          if [[ "$SETTINGS_FILE" == *.kts ]]; then
            if ! grep -q "com.google.gms.google-services" "$SETTINGS_FILE"; then
              sed -i '/id("com.android.application")/a\    id("com.google.gms.google-services") version "4.4.2" apply false' "$SETTINGS_FILE"
            fi
          else
            if ! grep -q "com.google.gms.google-services" "$SETTINGS_FILE"; then
              sed -i '/id "com.android.application"/a\    id "com.google.gms.google-services" version "4.4.2" apply false' "$SETTINGS_FILE"
            fi
          fi

          if [[ "$APP_BUILD_FILE" == *.kts ]]; then
            if ! grep -q "com.google.gms.google-services" "$APP_BUILD_FILE"; then
              sed -i '/id("dev.flutter.flutter-gradle-plugin")/a\    id("com.google.gms.google-services")' "$APP_BUILD_FILE"
            fi
            if ! grep -q "firebase-bom" "$APP_BUILD_FILE"; then
              printf '\ndependencies {\n    implementation(platform("com.google.firebase:firebase-bom:33.4.0"))\n}\n' >> "$APP_BUILD_FILE"
            fi
          else
            if ! grep -q "com.google.gms.google-services" "$APP_BUILD_FILE"; then
              sed -i '/id "dev.flutter.flutter-gradle-plugin"/a\    id "com.google.gms.google-services"' "$APP_BUILD_FILE"
            fi
            if ! grep -q "firebase-bom" "$APP_BUILD_FILE"; then
              printf '\ndependencies {\n    implementation platform("com.google.firebase:firebase-bom:33.4.0")\n}\n' >> "$APP_BUILD_FILE"
            fi
          fi

          echo "----- $SETTINGS_FILE -----"
          cat "$SETTINGS_FILE"
          echo "----- $APP_BUILD_FILE (tail) -----"
          tail -n 15 "$APP_BUILD_FILE"

      - name: Restore google-services.json from secret (optional)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "No GOOGLE_SERVICES_JSON secret set - using the file committed at android/app/google-services.json"
          else
            echo "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json
          fi

      - name: Restore firebase_options.dart from secret (optional)
        env:
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
        run: |
          if [ -z "$FIREBASE_OPTIONS_DART" ]; then
            echo "No FIREBASE_OPTIONS_DART secret set - using the file committed at lib/firebase_options.dart"
          else
            echo "$FIREBASE_OPTIONS_DART" | base64 --decode > lib/firebase_options.dart
          fi

      - name: Fail early with a clear message if Firebase was never configured
        run: |
          if grep -q "REPLACE_WITH_ANDROID_API_KEY" lib/firebase_options.dart; then
            echo "::error::lib/firebase_options.dart still has placeholder values. Follow README.md step 3 before building."
            exit 1
          fi
          if [ ! -f android/app/google-services.json ]; then
            echo "::error::android/app/google-services.json is missing. Follow README.md step 3 before building."
            exit 1
          fi

      - name: Install Flutter packages
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze --no-fatal-infos || true

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Build release APK (unsigned / debug-signed)
        run: flutter build apk --release

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
