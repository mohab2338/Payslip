name: Build & Deploy Web App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build web app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      # Same reasoning as the Android workflow: generate a fresh web/ folder
      # from this Flutter version's own template instead of committing one,
      # so it never goes stale.
      - name: Generate a fresh web/ project from this Flutter version's own template
        run: flutter create --platforms=web --org com.example --project-name salary_tracker .

      - name: Restore firebase_options.dart from secret (optional)
        env:
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
        run: |
          if [ -z "$FIREBASE_OPTIONS_DART" ]; then
            echo "No FIREBASE_OPTIONS_DART secret set - using the file committed at lib/firebase_options.dart"
          else
            echo "$FIREBASE_OPTIONS_DART" | base64 --decode > lib/firebase_options.dart
          fi

      - name: Fail early with a clear message if the web app was never registered in Firebase
        run: |
          if grep -q "REPLACE_WITH_WEB_API_KEY" lib/firebase_options.dart; then
            echo "::error::lib/firebase_options.dart still has placeholder WEB values. Follow README.md 'Add a web version for iPhone' section before building."
            exit 1
          fi

      - name: Install Flutter packages
        run: flutter pub get

      # This repo is served from a GitHub Pages *project* site
      # (username.github.io/reponame/), so all asset URLs need that
      # repository-name prefix - --base-href does that for us.
      - name: Build web app
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
